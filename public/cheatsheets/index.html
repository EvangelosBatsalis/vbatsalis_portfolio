<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyHub - Family Planner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Smooth transitions */
        * {
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide Icons as React components
        const Icons = {
            Calendar: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            ),
            CheckCircle: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            ),
            Circle: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                </svg>
            ),
            ShoppingBag: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            ),
            User: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            ),
            Home: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            ),
            ListTodo: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="5" width="6" height="6" rx="1"></rect>
                    <path d="m3 17 2 2 4-4"></path>
                    <path d="M13 6h8"></path>
                    <path d="M13 12h8"></path>
                    <path d="M13 18h8"></path>
                </svg>
            ),
            Bell: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            ),
            Plus: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            ),
            ChevronRight: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            ),
            DollarSign: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            ),
            Users: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            ),
            LogOut: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            ),
            Clock: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            ),
            School: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            ),
            Theater: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path>
                    <line x1="2" y1="20" x2="2.01" y2="20"></line>
                </svg>
            ),
            Plane: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
                </svg>
            ),
            Coffee: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
            ),
            Wallet: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
                </svg>
            ),
            PieChart: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                </svg>
            ),
            TrendingUp: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                    <polyline points="17 6 23 6 23 12"></polyline>
                </svg>
            ),
            Check: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            ),
            Eye: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            ),
            EyeOff: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            )
        };

        // Main App Component
        function FamilyPlannerApp() {
            const [currentScreen, setCurrentScreen] = useState('login');
            const [activeTab, setActiveTab] = useState('home');
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            const navigate = (screen) => {
                if (screen === 'login') {
                    setIsLoggedIn(false);
                    setCurrentScreen('login');
                } else {
                    setCurrentScreen('main');
                    setActiveTab(screen);
                }
            };

            if (!isLoggedIn) {
                return <LoginScreen onLogin={() => { setIsLoggedIn(true); navigate('home'); }} />;
            }

            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="w-full max-w-[375px] h-[812px] bg-white rounded-[3rem] shadow-2xl overflow-hidden border-[14px] border-gray-900 relative">
                        <StatusBar />
                        <div className="flex-1 overflow-hidden" style={{ height: 'calc(100% - 44px)' }}>
                            {activeTab === 'home' && <HomeScreen navigate={navigate} />}
                            {activeTab === 'calendar' && <CalendarScreen />}
                            {activeTab === 'tasks' && <TasksScreen />}
                            {activeTab === 'shopping' && <ShoppingScreen />}
                            {activeTab === 'obligations' && <ObligationsScreen />}
                            {activeTab === 'money' && <MoneyScreen />}
                            {activeTab === 'profile' && <ProfileScreen navigate={navigate} />}
                        </div>
                        <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
                    </div>
                </div>
            );
        }

        // StatusBar Component
        function StatusBar() {
            return (
                <div className="h-11 bg-white flex items-center justify-between px-8 pt-2">
                    <span className="text-sm font-semibold">9:41</span>
                    <div className="flex gap-1 items-center">
                        <div className="text-xs">📶</div>
                        <div className="text-xs">📱</div>
                        <div className="text-xs">🔋</div>
                    </div>
                </div>
            );
        }

        // Login Screen
        function LoginScreen({ onLogin }) {
            const [showPassword, setShowPassword] = useState(false);

            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 p-4">
                    <div className="w-full max-w-[375px] h-[812px] bg-white rounded-[3rem] shadow-2xl overflow-hidden border-[14px] border-gray-900">
                        <StatusBar />
                        <div className="flex flex-col items-center justify-center h-full px-8">
                            <div className="mb-12">
                                <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl flex items-center justify-center shadow-lg mb-4 mx-auto">
                                    <Icons.Users />
                                </div>
                                <h1 className="text-3xl font-bold text-gray-900 text-center">FamilyHub</h1>
                                <p className="text-gray-500 text-center mt-2">Οργανώστε την οικογένειά σας</p>
                            </div>

                            <div className="w-full space-y-4 mb-6">
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-2 block">Email</label>
                                    <input
                                        type="email"
                                        placeholder="family@example.com"
                                        className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-2 block">Password</label>
                                    <div className="relative">
                                        <input
                                            type={showPassword ? "text" : "password"}
                                            placeholder="••••••••"
                                            className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:outline-none pr-12"
                                        />
                                        <button
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                                        >
                                            {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={onLogin}
                                className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all"
                            >
                                Σύνδεση
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Home Screen (simplified version for demonstration)
        function HomeScreen({ navigate }) {
            const familyMembers = [
                { name: 'Μαρία', tasks: 3, color: '#EC4899', completed: 2 },
                { name: 'Γιάννης', tasks: 4, color: '#3B82F6', completed: 1 },
                { name: 'Σοφία', tasks: 2, color: '#8B5CF6', completed: 2 },
                { name: 'Πέτρος', tasks: 5, color: '#F59E0B', completed: 3 }
            ];

            const todayEvents = [
                { time: '09:00', title: 'Γιατρός - Σοφία' },
                { time: '15:00', title: 'Μπάσκετ - Γιάννης' },
                { time: '18:00', title: 'Σούπερ Μάρκετ' }
            ];

            return (
                <div className="h-full flex flex-col">
                    <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 pt-4 pb-6">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-white/80 text-sm">Πέμπτη, 22 Ιανουαρίου</p>
                                <h1 className="text-white text-2xl font-bold mt-1">Καλημέρα! 👋</h1>
                            </div>
                            <button className="bg-white/20 backdrop-blur-sm p-2 rounded-full">
                                <Icons.Bell />
                            </button>
                        </div>
                        <div className="grid grid-cols-3 gap-3">
                            {[
                                { label: 'Σήμερα', value: '14', sub: 'tasks' },
                                { label: 'Ολοκληρώθηκαν', value: '8', sub: 'από 14' },
                                { label: 'Events', value: '3', sub: 'σήμερα' }
                            ].map((stat, idx) => (
                                <div key={idx} className="bg-white/20 backdrop-blur-sm rounded-2xl p-3">
                                    <p className="text-white/80 text-xs">{stat.label}</p>
                                    <p className="text-white text-2xl font-bold">{stat.value}</p>
                                    <p className="text-white/80 text-xs">{stat.sub}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto pb-20">
                        <div className="px-6 py-4 bg-gray-50">
                            <h2 className="text-lg font-bold text-gray-900 mb-3">📅 Σήμερα</h2>
                            <div className="space-y-3">
                                {todayEvents.map((event, idx) => (
                                    <div key={idx} className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-indigo-100 rounded-lg px-3 py-2 min-w-[60px] text-center">
                                                <p className="text-indigo-600 font-bold text-sm">{event.time}</p>
                                            </div>
                                            <p className="flex-1 font-semibold text-gray-900">{event.title}</p>
                                            <div className="w-2 h-2 rounded-full bg-indigo-500"></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="px-6 py-4">
                            <h2 className="text-lg font-bold text-gray-900 mb-3">👨‍👩‍👧‍👦 Οικογένεια</h2>
                            <div className="grid grid-cols-2 gap-3">
                                {familyMembers.map((member, idx) => (
                                    <div key={idx} className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                                        <div 
                                            className="w-12 h-12 rounded-full flex items-center justify-center mb-3 text-white text-xl font-bold"
                                            style={{ backgroundColor: member.color }}
                                        >
                                            {member.name[0]}
                                        </div>
                                        <p className="font-semibold text-gray-900 text-sm mb-1">{member.name}</p>
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 bg-gray-100 rounded-full h-2">
                                                <div 
                                                    className="h-2 rounded-full"
                                                    style={{ 
                                                        width: `${(member.completed / member.tasks) * 100}%`,
                                                        backgroundColor: member.color
                                                    }}
                                                ></div>
                                            </div>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-2">
                                            {member.completed}/{member.tasks} tasks
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Simplified placeholder screens
        function CalendarScreen() {
            return <PlaceholderScreen title="Ημερολόγιο" icon="Calendar" color="from-purple-600 to-pink-600" />;
        }

        function TasksScreen() {
            return <PlaceholderScreen title="Εργασίες" icon="ListTodo" color="from-blue-600 to-cyan-600" />;
        }

        function ShoppingScreen() {
            return <PlaceholderScreen title="Λίστες Αγορών" icon="ShoppingBag" color="from-green-600 to-emerald-600" />;
        }

        function ObligationsScreen() {
            return <PlaceholderScreen title="Υποχρεώσεις" icon="School" color="from-indigo-600 to-purple-600" />;
        }

        function MoneyScreen() {
            return <PlaceholderScreen title="Οικονομικά" icon="DollarSign" color="from-emerald-600 to-teal-600" />;
        }

        function ProfileScreen({ navigate }) {
            return (
                <div className="h-full flex flex-col bg-gray-50">
                    <div className="bg-gradient-to-r from-pink-600 to-rose-600 px-6 pt-6 pb-8">
                        <h1 className="text-white text-2xl font-bold mb-1">Προφίλ</h1>
                        <p className="text-white/80 text-sm">Οικογένεια Παπαδοπούλου</p>
                    </div>
                    <div className="flex-1 overflow-y-auto px-6 py-4">
                        <button
                            onClick={() => navigate('login')}
                            className="w-full bg-red-50 text-red-600 py-4 rounded-xl font-semibold flex items-center justify-center gap-2 hover:bg-red-100 transition-colors mt-4"
                        >
                            <Icons.LogOut />
                            Αποσύνδεση
                        </button>
                    </div>
                </div>
            );
        }

        function PlaceholderScreen({ title, icon, color }) {
            const IconComponent = Icons[icon];
            return (
                <div className="h-full flex flex-col bg-gray-50">
                    <div className={`bg-gradient-to-r ${color} px-6 pt-6 pb-4`}>
                        <h1 className="text-white text-2xl font-bold mb-1">{title}</h1>
                    </div>
                    <div className="flex-1 flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-24 h-24 bg-gray-200 rounded-3xl flex items-center justify-center mx-auto mb-4">
                                <IconComponent />
                            </div>
                            <p className="text-gray-500">Δείτε το πλήρες app στο React component</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Bottom Navigation
        function BottomNav({ activeTab, setActiveTab }) {
            const tabs = [
                { id: 'home', icon: 'Home', label: 'Αρχική' },
                { id: 'calendar', icon: 'Calendar', label: 'Ημερολόγιο' },
                { id: 'tasks', icon: 'ListTodo', label: 'Tasks' },
                { id: 'shopping', icon: 'ShoppingBag', label: 'Αγορές' },
                { id: 'obligations', icon: 'School', label: 'Υποχρ.' },
                { id: 'money', icon: 'DollarSign', label: 'Οικον.' },
                { id: 'profile', icon: 'User', label: 'Προφίλ' }
            ];

            return (
                <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-3 py-2 pb-4">
                    <div className="flex justify-around items-center">
                        {tabs.map((tab) => {
                            const IconComponent = Icons[tab.icon];
                            return (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center gap-1 transition-colors ${
                                        activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'
                                    }`}
                                >
                                    <IconComponent />
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<FamilyPlannerApp />, document.getElementById('root'));
    </script>
